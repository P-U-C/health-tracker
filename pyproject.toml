[project]
name = "health-tracker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.115",
  "pandas>=2.2",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
